name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resifix
          POSTGRES_PASSWORD: resifix
          POSTGRES_DB: resifix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resifix -d resifix_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://resifix:resifix@localhost:5432/resifix_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (also generates the Prisma client)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations to throwaway Postgres
        run: npm run migrate:deploy

      - name: Schema and migrations are in sync
        run: npm run migrate:check

      - name: Seed
        run: npm run seed

      # GitHub service containers cannot pass a command, which MinIO needs, so start it here.
      # Same image as docker-compose.yml.
      - name: Start MinIO (photo storage for the e2e tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=resifix -e MINIO_ROOT_PASSWORD=resifix-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do curl -fs localhost:9000/minio/health/ready && break; sleep 1; done
          curl -fs localhost:9000/minio/health/ready

      # Unit tests, then HTTP tests against the real app. The e2e tests use their own database
      # (resifix_ci_test, created and migrated by test/global-setup.ts), Redis DB 15 and bucket.
      - name: Tests (unit + e2e)
        run: npm test

      - name: Build API (NestJS) and client (React PWA)
        run: npm run build

      - name: API smoke test
        run: |
          npm start > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:3000/api/health && break; sleep 1; done
          curl -fs localhost:3000/api/health | grep -q '"redis":"ok"'
          curl -fs -X POST localhost:3000/api/auth/request-otp -H 'content-type: application/json' -d '{"phone":"0700000010"}'
          TOKEN=$(curl -fs -X POST localhost:3000/api/auth/verify-otp -H 'content-type: application/json' -d '{"phone":"0700000010","code":"123456"}' | sed 's/.*"token":"\([^"]*\)".*/\1/')
          curl -fs localhost:3000/api/tickets -H "Authorization: Bearer $TOKEN" | grep -q '"tickets"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/custodian/queue -H "Authorization: Bearer $TOKEN")" = 403

      - name: API log
        if: always()
        run: cat api.log || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f server/Dockerfile -t resifix-api .
          docker build -f client/Dockerfile -t resifix-web .
